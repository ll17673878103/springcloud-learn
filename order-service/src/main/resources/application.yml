# 服务端口
server:
  port: 8082

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://39.106.163.134:3306/springcloud?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ll291451

  # MyBatis-Plus 配置
  sql-init-mode: never

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.learn.orderservice.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

  # OpenFeign 超时配置
  openfeign:
    client:
      config:
        default:
          connect-timeout: 3000
          read-timeout: 5000
        user-service:
          connect-timeout: 2000
          read-timeout: 3000
    okhttp:
      enabled: true

# Sentinel 配置
sentinel:
  transport:
    dashboard: localhost:8080
    port: 8719
  eagerness: true

feign:
  sentinel:
    enabled: true

# Seata 分布式事务配置
seata:
  enabled: true
  application-id: order-service
  tx-service-group: my_tx_group
  service:
    vgroup-mapping:
      my_tx_group: default
  registry:
    type: nacos
    nacos:
      server-addr: 39.106.163.134:8848
      username: nacos
      password: nacos
      group: SEATA_GROUP
      application: seata-server
      namespace: f4514ed6-75e2-4721-8032-ed952ec5f23f

# 日志配置
logging:
  level:
    com.learn.orderservice: debug
    com.learn.orderservice.feign: debug
    com.baomidou.mybatisplus: debug

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
